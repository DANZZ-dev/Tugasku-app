<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1F2A5C">
<title>TugasKu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1F2A5C; --ink-soft:#4A5485; --paper:#F7F8FC; --card:#FFFFFF;
  --yellow:#FFD84D; --pink:#FF7A9C; --mint:#5CE0B8; --sky:#7DB7FF; --red:#E5484D;
  --line:#E3E6F2;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'DM Sans',system-ui,sans-serif;background:var(--ink);color:var(--ink);
  display:flex;justify-content:center;overscroll-behavior:none;
}
.app{
  width:100%;max-width:480px;height:100dvh;background:var(--paper);position:relative;
  display:flex;flex-direction:column;overflow:hidden;
}

/* ---------- Header ---------- */
.top{
  background:var(--ink);color:#fff;padding:calc(env(safe-area-inset-top) + 20px) 22px 46px;
  border-radius:0 0 34px 34px;position:relative;flex-shrink:0;
}
.top small{opacity:.7;font-size:13px}
.top h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:28px;line-height:1.1;margin-top:4px;letter-spacing:-.5px}
.hero{display:flex;align-items:center;gap:18px;margin-top:20px}
.ring{position:relative;width:96px;height:96px;flex-shrink:0}
.ring svg{transform:rotate(-90deg)}
.ring .bg{stroke:rgba(255,255,255,.15)}
.ring .fg{stroke:var(--yellow);stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.3,1.2,.4,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:'Bricolage Grotesque';font-size:24px;font-weight:800}
.hero p{font-size:15px;line-height:1.45;opacity:.92}
.hero p strong{color:var(--yellow)}

/* ---------- Filter ---------- */
.tabs{
  display:flex;gap:8px;padding:0 18px;margin-top:-22px;position:relative;z-index:2;flex-shrink:0;
}
.tab{
  flex:1;border:0;background:var(--card);color:var(--ink-soft);font:700 13px 'DM Sans';
  padding:12px 6px;border-radius:16px;box-shadow:0 4px 14px rgba(31,42,92,.12);cursor:pointer;
  transition:transform .15s, background .2s, color .2s;
}
.tab:active{transform:scale(.95)}
.tab.on{background:var(--yellow);color:var(--ink)}

/* ---------- List ---------- */
.list{flex:1;overflow-y:auto;padding:18px 18px 120px;scrollbar-width:none}
.list::-webkit-scrollbar{display:none}
.group{font:700 13px 'DM Sans';color:var(--ink-soft);margin:14px 4px 10px}

.swipe{position:relative;margin-bottom:12px;border-radius:20px;overflow:hidden;background:var(--mint);touch-action:pan-y}
.swipe .hint{
  position:absolute;inset:0;display:flex;align-items:center;padding-left:22px;font-weight:700;color:var(--ink);gap:8px;
}
.item{
  position:relative;background:var(--card);border-radius:20px;padding:16px 16px 16px 22px;
  display:flex;gap:12px;align-items:flex-start;box-shadow:0 2px 0 var(--line);
  transition:transform .25s cubic-bezier(.3,1.3,.5,1);cursor:grab;
}
.item.drag{transition:none;cursor:grabbing}
.item::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:6px;border-radius:0 6px 6px 0;background:var(--c)}
.chk{
  width:26px;height:26px;border-radius:9px;border:2.5px solid var(--c);flex-shrink:0;margin-top:1px;
  display:grid;place-items:center;background:transparent;cursor:pointer;transition:background .2s,transform .2s;
}
.chk:active{transform:scale(.85)}
.chk svg{width:14px;height:14px;stroke:#fff;stroke-width:3.5;fill:none;stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset .3s .05s}
.item.done .chk{background:var(--c)}
.item.done .chk svg{stroke-dashoffset:0}
.info{flex:1;min-width:0}
.info h3{font-family:'Bricolage Grotesque';font-weight:600;font-size:17px;line-height:1.25;transition:color .2s}
.item.done h3{text-decoration:line-through;color:#9AA1C4}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;font-size:12.5px}
.pill{padding:4px 10px;border-radius:99px;background:color-mix(in srgb,var(--c) 22%,white);font-weight:700}
.due{padding:4px 10px;border-radius:99px;background:#EEF0F8;color:var(--ink-soft);font-weight:500}
.due.urgent{background:#FFE3E4;color:var(--red);font-weight:700}
.del{border:0;background:none;color:#B5BBD6;font-size:20px;line-height:1;padding:2px 4px;cursor:pointer}
.del:hover{color:var(--red)}

.empty{text-align:center;padding:50px 20px;color:var(--ink-soft)}
.empty .em{font-size:52px;display:block;margin-bottom:10px}
.empty b{display:block;color:var(--ink);font:800 20px 'Bricolage Grotesque';margin-bottom:4px}

/* ---------- FAB ---------- */
.fab{
  position:absolute;right:20px;bottom:calc(env(safe-area-inset-bottom) + 22px);width:64px;height:64px;border-radius:22px;
  background:var(--pink);border:0;color:var(--ink);font-size:34px;font-weight:300;cursor:pointer;
  box-shadow:0 10px 24px rgba(255,122,156,.5);transition:transform .2s;z-index:5;
}
.fab:active{transform:scale(.9) rotate(90deg)}

/* ---------- Sheet ---------- */
.scrim{position:absolute;inset:0;background:rgba(15,20,50,.55);opacity:0;pointer-events:none;transition:opacity .25s;z-index:10}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{
  position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:30px 30px 0 0;z-index:11;
  padding:12px 22px calc(env(safe-area-inset-bottom) + 24px);transform:translateY(105%);
  transition:transform .35s cubic-bezier(.3,1.1,.4,1);
}
.sheet.open{transform:none}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 16px}
.sheet h2{font:800 22px 'Bricolage Grotesque';margin-bottom:14px}
label{display:block;font-weight:700;font-size:13px;color:var(--ink-soft);margin:12px 0 6px}
input[type=text],input[type=datetime-local]{
  width:100%;padding:14px;border:2px solid var(--line);border-radius:14px;font:500 16px 'DM Sans';color:var(--ink);background:var(--paper);outline:none;
}
input:focus{border-color:var(--ink)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{
  padding:10px 14px;border-radius:14px;border:2.5px solid transparent;background:color-mix(in srgb,var(--c) 30%,white);
  font:700 13px 'DM Sans';color:var(--ink);cursor:pointer;transition:transform .15s;
}
.sw.on{border-color:var(--ink);transform:scale(1.06)}
.save{
  width:100%;margin-top:22px;padding:16px;border:0;border-radius:16px;background:var(--ink);color:#fff;
  font:800 17px 'Bricolage Grotesque';cursor:pointer;transition:transform .15s;
}
.save:active{transform:scale(.97)}

/* ---------- Setelan ---------- */
.gear{
  position:absolute;right:18px;top:calc(env(safe-area-inset-top) + 18px);width:42px;height:42px;border-radius:14px;
  border:0;background:rgba(255,255,255,.14);color:#fff;font-size:20px;cursor:pointer;transition:transform .3s,background .2s;
}
.gear:active{transform:rotate(60deg) scale(.9);background:rgba(255,255,255,.25)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{position:relative}
.field input[type=number]{
  width:100%;padding:14px;padding-right:58px;border:2px solid var(--line);border-radius:14px;
  font:700 18px 'DM Sans';color:var(--ink);background:var(--paper);outline:none;
}
.field input[type=number]:focus{border-color:var(--ink)}
.field span{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--ink-soft);font-weight:500;pointer-events:none}
.unit{display:flex;gap:6px;margin-top:8px}
.unit button{
  flex:1;padding:9px 4px;border:2px solid var(--line);border-radius:12px;background:var(--paper);
  font:700 13px 'DM Sans';color:var(--ink-soft);cursor:pointer;transition:all .15s;
}
.unit button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.preview{
  margin-top:16px;padding:14px 16px;border-radius:16px;background:#EEF0F8;font-size:14px;line-height:1.5;color:var(--ink);
}
.preview b{font-family:'Bricolage Grotesque'}
.switch{display:flex;align-items:center;justify-content:space-between;padding:4px 0}
.switch b{font-size:15px}
.tgl{
  width:52px;height:30px;border-radius:99px;background:var(--line);border:0;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0;
}
.tgl::after{
  content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;
  box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .25s cubic-bezier(.3,1.4,.5,1);
}
.tgl.on{background:var(--mint)}
.tgl.on::after{transform:translateX(22px)}
.testbtn{
  width:100%;margin-top:10px;padding:13px;border:2px solid var(--ink);border-radius:14px;background:transparent;
  font:700 14px 'DM Sans';color:var(--ink);cursor:pointer;
}
.testbtn:active{transform:scale(.97)}

/* ---------- Toast & konfeti ---------- */
.toast{
  position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translate(-50%,-90px);
  background:var(--ink);color:#fff;padding:12px 20px;border-radius:99px;font-weight:700;font-size:14px;z-index:30;
  box-shadow:0 10px 30px rgba(0,0,0,.25);transition:transform .4s cubic-bezier(.3,1.4,.5,1);white-space:nowrap;
}
.toast.show{transform:translate(-50%,0)}
.confetti{position:absolute;width:9px;height:14px;border-radius:2px;z-index:40;pointer-events:none}

@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>
<body>
<div class="app" id="app">

  <header class="top">
    <button class="gear" id="gear" aria-label="Pengaturan notifikasi">⚙</button>
    <small id="tgl"></small>
    <h1>Halo, ayo selesaikan tugasmu!</h1>
    <div class="hero">
      <div class="ring">
        <svg width="96" height="96" viewBox="0 0 96 96">
          <circle class="bg" cx="48" cy="48" r="40" fill="none" stroke-width="11"/>
          <circle class="fg" id="fg" cx="48" cy="48" r="40" fill="none" stroke-width="11" stroke-dasharray="251.3" stroke-dashoffset="251.3"/>
        </svg>
        <b id="pct">0%</b>
      </div>
      <p id="ringtxt"></p>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab on" data-f="aktif">Aktif</button>
    <button class="tab" data-f="hari">Hari ini</button>
    <button class="tab" data-f="selesai">Selesai</button>
  </nav>

  <main class="list" id="list"></main>

  <button class="fab" id="fab" aria-label="Tambah tugas">+</button>

  <div class="scrim" id="scrim"></div>
  <section class="sheet" id="sheet" aria-label="Tambah tugas">
    <div class="grab"></div>
    <h2>Tugas baru</h2>
    <label for="nama">Nama tugas</label>
    <input type="text" id="nama" placeholder="Contoh: Laporan praktikum 3" autocomplete="off">
    <label for="mk">Mata kuliah</label>
    <input type="text" id="mk" placeholder="Contoh: Basis Data" autocomplete="off">
    <label for="tempo">Tenggat</label>
    <input type="datetime-local" id="tempo">
    <label>Warna</label>
    <div class="swatches" id="sw"></div>
    <button class="save" id="save">Simpan tugas</button>
  </section>

  <section class="sheet" id="sheetSet" aria-label="Pengaturan notifikasi">
    <div class="grab"></div>
    <h2>Pengaturan notifikasi</h2>

    <div class="switch">
      <b>Aktifkan pengingat</b>
      <button class="tgl on" id="sOn" aria-label="Aktifkan pengingat"></button>
    </div>

    <label>Mulai diingatkan</label>
    <div class="field"><input type="number" id="sStart" min="1" max="999" inputmode="numeric"><span id="sStartU">jam</span></div>
    <div class="unit" data-for="start">
      <button data-u="m">Menit</button><button data-u="h">Jam</button><button data-u="d">Hari</button>
    </div>
    <div style="font-size:12px;color:var(--ink-soft);margin-top:6px">sebelum tenggat</div>

    <div class="row2">
      <div>
        <label for="sCount">Jumlah notifikasi</label>
        <div class="field"><input type="number" id="sCount" min="1" max="20" inputmode="numeric"><span>kali</span></div>
      </div>
      <div>
        <label for="sGap">Jeda antar notifikasi</label>
        <div class="field"><input type="number" id="sGap" min="1" max="999" inputmode="numeric"><span id="sGapU">jam</span></div>
      </div>
    </div>
    <div class="unit" data-for="gap">
      <button data-u="m">Menit</button><button data-u="h">Jam</button><button data-u="d">Hari</button>
    </div>

    <div class="preview" id="sPrev"></div>
    <button class="testbtn" id="sTest">Coba kirim notifikasi</button>
    <button class="save" id="sSave">Simpan pengaturan</button>
  </section>

  <div class="toast" id="toast"></div>
</div>

<script src="capacitor.js"></script>
<script>
(() => {
  const COLORS = [
    {n:'Kuning', v:'#F2B705'}, {n:'Pink', v:'#FF5C87'}, {n:'Mint', v:'#1FBF93'},
    {n:'Biru', v:'#4C93F5'}, {n:'Ungu', v:'#8B6CF0'}
  ];
  const KEY = 'tugasku.v1';
  let tasks = [];
  try { tasks = JSON.parse(localStorage.getItem(KEY)) || []; } catch(e){ tasks = []; }
  let filter = 'aktif';
  let pickedColor = COLORS[0].v;

  const $ = s => document.querySelector(s);
  const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(tasks)); }catch(e){} };
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);

  // contoh data awal supaya tampilan tidak kosong saat pertama dibuka
  if (!tasks.length && !localStorage.getItem(KEY + '.seeded')) {
    const now = Date.now(), H = 3600e3;
    tasks = [
      {id:uid(), t:'Kumpulkan makalah bab 2', mk:'Metodologi Penelitian', due:now + 5*H, c:'#FF5C87', done:false},
      {id:uid(), t:'Latihan soal normalisasi', mk:'Basis Data', due:now + 30*H, c:'#4C93F5', done:false},
      {id:uid(), t:'Baca jurnal untuk presentasi', mk:'Kecerdasan Buatan', due:now + 72*H, c:'#8B6CF0', done:false},
    ];
    localStorage.setItem(KEY + '.seeded', '1'); save();
  }

  // ---------- Util tanggal ----------
  const hari = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
  const bulan = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  const sameDay = (a,b) => new Date(a).toDateString() === new Date(b).toDateString();
  const pad = n => String(n).padStart(2,'0');

  function dueInfo(ms){
    const diff = ms - Date.now(), d = new Date(ms);
    const jam = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
    if (diff < 0) return {txt:`Terlambat • ${d.getDate()} ${bulan[d.getMonth()]}`, urgent:true};
    if (diff < 3600e3) return {txt:`${Math.max(1,Math.round(diff/60000))} menit lagi`, urgent:true};
    if (sameDay(ms, Date.now())) return {txt:`Hari ini, ${jam}`, urgent:diff < 6*3600e3};
    if (sameDay(ms, Date.now()+86400e3)) return {txt:`Besok, ${jam}`, urgent:false};
    return {txt:`${hari[d.getDay()]}, ${d.getDate()} ${bulan[d.getMonth()]} • ${jam}`, urgent:false};
  }

  // ---------- Render ----------
  function render(){
    const now = new Date();
    $('#tgl').textContent = `${hari[now.getDay()]}, ${now.getDate()} ${bulan[now.getMonth()]} ${now.getFullYear()}`;

    const total = tasks.length, sudah = tasks.filter(t=>t.done).length;
    const p = total ? Math.round(sudah/total*100) : 0;
    $('#fg').style.strokeDashoffset = 251.3 * (1 - p/100);
    $('#pct').textContent = p + '%';
    const sisa = total - sudah;
    $('#ringtxt').innerHTML = total === 0
      ? 'Belum ada tugas. Tekan <strong>+</strong> untuk mulai.'
      : sisa === 0 ? '<strong>Semua tugas beres!</strong> Waktunya istirahat.'
      : `<strong>${sisa} tugas</strong> lagi yang belum selesai dari ${total} tugas.`;

    let list = tasks.slice();
    if (filter === 'aktif') list = list.filter(t=>!t.done);
    else if (filter === 'hari') list = list.filter(t=>!t.done && (sameDay(t.due, Date.now()) || t.due < Date.now()));
    else list = list.filter(t=>t.done);
    list.sort((a,b)=> filter==='selesai' ? b.due-a.due : a.due-b.due);

    const el = $('#list');
    if (!list.length){
      const msg = {
        aktif:['🎒','Tidak ada tugas aktif','Tekan tombol + untuk menambah tugas baru.'],
        hari:['☀️','Hari ini bebas tugas','Tidak ada tenggat yang mendesak.'],
        selesai:['📚','Belum ada yang selesai','Geser tugas ke kanan untuk menyelesaikannya.']
      }[filter];
      el.innerHTML = `<div class="empty"><span class="em">${msg[0]}</span><b>${msg[1]}</b>${msg[2]}</div>`;
      return;
    }
    el.innerHTML = (filter==='aktif' ? '<div class="group">Geser kartu ke kanan untuk menyelesaikan</div>' : '') +
      list.map(t=>{
        const di = dueInfo(t.due);
        return `<div class="swipe" data-id="${t.id}">
          <div class="hint">✓ Selesai</div>
          <div class="item ${t.done?'done':''}" style="--c:${t.c}">
            <div class="chk" data-act="toggle"><svg viewBox="0 0 16 16"><path d="M2 8.5l4 4 8-9"/></svg></div>
            <div class="info">
              <h3>${esc(t.t)}</h3>
              <div class="meta">
                <span class="pill">${esc(t.mk||'Umum')}</span>
                <span class="due ${!t.done&&di.urgent?'urgent':''}">${di.txt}</span>
              </div>
            </div>
            <button class="del" data-act="del" aria-label="Hapus tugas">×</button>
          </div>
        </div>`;
      }).join('');
    bindSwipe();
  }
  const esc = s => String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

  // ---------- Aksi ----------
  function toggle(id, from){
    const t = tasks.find(x=>x.id===id); if(!t) return;
    t.done = !t.done; save();
    if (t.done){ confetti(from); toast('Tugas selesai. Mantap!'); }
    else toast('Tugas dikembalikan ke daftar aktif');
    render();
  }
  function remove(id){
    const t = tasks.find(x=>x.id===id); if(!t) return;
    tasks = tasks.filter(x=>x.id!==id); save(); render(); toast('Tugas dihapus');
  }

  $('#list').addEventListener('click', e=>{
    const act = e.target.closest('[data-act]'); if(!act) return;
    const id = act.closest('.swipe').dataset.id;
    if (act.dataset.act==='toggle') toggle(id, act);
    if (act.dataset.act==='del') remove(id);
  });

  // ---------- Swipe untuk selesai ----------
  function bindSwipe(){
    document.querySelectorAll('.swipe').forEach(sw=>{
      const item = sw.querySelector('.item');
      let sx=0, dx=0, on=false;
      const start = x => { on=true; sx=x; dx=0; item.classList.add('drag'); };
      const move = x => { if(!on) return; dx=Math.max(0, x-sx); item.style.transform=`translateX(${dx}px)`; };
      const end = () => {
        if(!on) return; on=false; item.classList.remove('drag');
        const limit = sw.offsetWidth * .4;
        if (dx > limit){
          item.style.transform = `translateX(110%)`;
          setTimeout(()=>toggle(sw.dataset.id, item), 200);
        } else item.style.transform = '';
      };
      item.addEventListener('touchstart', e=>{ if(e.target.closest('[data-act]')) return; start(e.touches[0].clientX); }, {passive:true});
      item.addEventListener('touchmove', e=>move(e.touches[0].clientX), {passive:true});
      item.addEventListener('touchend', end);
      item.addEventListener('mousedown', e=>{ if(e.target.closest('[data-act]')) return; start(e.clientX); });
      window.addEventListener('mousemove', e=>move(e.clientX));
      window.addEventListener('mouseup', end);
    });
  }

  // ---------- Filter ----------
  $('#tabs').addEventListener('click', e=>{
    const b = e.target.closest('.tab'); if(!b) return;
    filter = b.dataset.f;
    document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on', x===b));
    render();
  });

  // ---------- Sheet tambah tugas ----------
  const sheet = $('#sheet'), scrim = $('#scrim');
  $('#sw').innerHTML = COLORS.map((c,i)=>`<button class="sw ${i===0?'on':''}" style="--c:${c.v}" data-c="${c.v}">${c.n}</button>`).join('');
  $('#sw').addEventListener('click', e=>{
    const b = e.target.closest('.sw'); if(!b) return;
    pickedColor = b.dataset.c;
    document.querySelectorAll('.sw').forEach(x=>x.classList.toggle('on', x===b));
  });

  function defaultDue(){
    const d = new Date(Date.now() + 24*3600e3); d.setMinutes(0,0,0);
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:00`;
  }
  function openSheet(){
    $('#tempo').value = defaultDue();
    sheet.classList.add('open'); scrim.classList.add('open');
    setTimeout(()=>$('#nama').focus(), 350);
  }
  function closeSheet(){ sheet.classList.remove('open'); if(!document.getElementById('sheetSet').classList.contains('open')) scrim.classList.remove('open'); }
  $('#fab').addEventListener('click', openSheet);
  scrim.addEventListener('click', ()=>{ closeSheet(); closeSet(); });

  $('#save').addEventListener('click', ()=>{
    const t = $('#nama').value.trim();
    const due = new Date($('#tempo').value).getTime();
    if (!t){ toast('Isi nama tugas dulu ya'); $('#nama').focus(); return; }
    if (isNaN(due)){ toast('Pilih tanggal dan jam tenggat'); return; }
    tasks.push({id:uid(), t, mk:$('#mk').value.trim(), due, c:pickedColor, done:false});
    save(); closeSheet(); $('#nama').value=''; $('#mk').value='';
    filter='aktif';
    document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on', x.dataset.f==='aktif'));
    render(); toast('Tugas disimpan');
    scheduleNotifs();
  });

  // ---------- Toast ----------
  let tt;
  function toast(msg){
    const el = $('#toast'); el.textContent = msg; el.classList.add('show');
    clearTimeout(tt); tt = setTimeout(()=>el.classList.remove('show'), 2000);
  }

  // ---------- Konfeti ----------
  function confetti(fromEl){
    if (matchMedia('(prefers-reduced-motion:reduce)').matches) return;
    const app = $('#app'), a = app.getBoundingClientRect();
    const r = fromEl.getBoundingClientRect();
    const ox = r.left - a.left + r.width/2, oy = r.top - a.top + r.height/2;
    const cols = ['#FFD84D','#FF7A9C','#5CE0B8','#7DB7FF','#8B6CF0'];
    for (let i=0;i<26;i++){
      const c = document.createElement('div'); c.className='confetti';
      c.style.left=ox+'px'; c.style.top=oy+'px'; c.style.background=cols[i%cols.length];
      app.appendChild(c);
      const ang = Math.random()*Math.PI*2, dist = 70 + Math.random()*110;
      c.animate([
        {transform:'translate(0,0) rotate(0)', opacity:1},
        {transform:`translate(${Math.cos(ang)*dist}px, ${Math.sin(ang)*dist+80}px) rotate(${Math.random()*720}deg)`, opacity:0}
      ], {duration:900+Math.random()*500, easing:'cubic-bezier(.2,.7,.3,1)'}).onfinish = ()=>c.remove();
    }
  }

  // ---------- Pengaturan notifikasi ----------
  const SKEY = KEY + '.settings';
  const UNIT_MS = {m:60e3, h:3600e3, d:86400e3};
  const UNIT_TXT = {m:'menit', h:'jam', d:'hari'};
  const DEF = {on:true, start:1, startU:'d', count:3, gap:6, gapU:'h'};
  let cfg;
  try { cfg = Object.assign({}, DEF, JSON.parse(localStorage.getItem(SKEY))); } catch(e){ cfg = {...DEF}; }
  let draft = {...cfg};

  const clamp = (v,min,max) => Math.min(max, Math.max(min, Math.round(Number(v)) || min));
  const durTxt = (n,u) => `${n} ${UNIT_TXT[u]}`;

  function paintSettings(){
    $('#sOn').classList.toggle('on', draft.on);
    $('#sStart').value = draft.start;
    $('#sGap').value = draft.gap;
    $('#sCount').value = draft.count;
    $('#sStartU').textContent = UNIT_TXT[draft.startU];
    $('#sGapU').textContent = UNIT_TXT[draft.gapU];
    document.querySelectorAll('.unit').forEach(g=>{
      const u = g.dataset.for === 'start' ? draft.startU : draft.gapU;
      g.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.u===u));
    });
    // pratinjau jadwal
    const first = draft.start * UNIT_MS[draft.startU], gap = draft.gap * UNIT_MS[draft.gapU];
    const times = Array.from({length:draft.count}, (_,i)=> first - i*gap).filter(x=>x>0);
    const lines = times.map(x=> x >= 60e3 ? fmtLeft(x) + ' sebelum tenggat' : 'tepat saat tenggat');
    $('#sPrev').innerHTML = !draft.on ? 'Pengingat dimatikan.' :
      `<b>${times.length} notifikasi</b> per tugas:<br>` + lines.map((l,i)=>`${i+1}. ${l}`).join('<br>') +
      (times.length < draft.count ? `<br><span style="color:var(--ink-soft)">${draft.count-times.length} notifikasi terakhir dilewati karena jadwalnya melewati tenggat.</span>` : '');
  }
  function fmtLeft(ms){
    const m = Math.round(ms/60e3);
    if (m >= 1440 && m % 1440 === 0) return (m/1440) + ' hari';
    if (m >= 60 && m % 60 === 0) return (m/60) + ' jam';
    if (m >= 60) return Math.floor(m/60) + ' jam ' + (m%60) + ' menit';
    return m + ' menit';
  }

  const sheetSet = $('#sheetSet');
  function openSet(){ draft = {...cfg}; paintSettings(); sheetSet.classList.add('open'); scrim.classList.add('open'); }
  function closeSet(){ sheetSet.classList.remove('open'); if(!sheet.classList.contains('open')) scrim.classList.remove('open'); }
  $('#gear').addEventListener('click', ()=>{ askNotif(); openSet(); });

  $('#sOn').addEventListener('click', ()=>{ draft.on = !draft.on; paintSettings(); });
  $('#sStart').addEventListener('input', e=>{ draft.start = clamp(e.target.value,1,999); paintSettingsKeepInput('sStart'); });
  $('#sGap').addEventListener('input', e=>{ draft.gap = clamp(e.target.value,1,999); paintSettingsKeepInput('sGap'); });
  $('#sCount').addEventListener('input', e=>{ draft.count = clamp(e.target.value,1,20); paintSettingsKeepInput('sCount'); });
  // agar kursor tidak lompat saat mengetik, jangan timpa isi kolom yang sedang diedit
  function paintSettingsKeepInput(id){
    const el = document.getElementById(id), v = el.value;
    paintSettings(); el.value = v;
  }
  ['sStart','sGap','sCount'].forEach(id=>{
    document.getElementById(id).addEventListener('blur', paintSettings);
  });
  document.querySelectorAll('.unit').forEach(g=>g.addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    draft[g.dataset.for === 'start' ? 'startU' : 'gapU'] = b.dataset.u; paintSettings();
  }));

  $('#sSave').addEventListener('click', ()=>{
    cfg = {...draft};
    localStorage.setItem(SKEY, JSON.stringify(cfg));
    // jadwal berubah, jadi riwayat notifikasi yang sudah terkirim direset
    notified.clear(); localStorage.setItem(KEY+'.notified', '[]');
    closeSet(); toast('Pengaturan disimpan'); scheduleNotifs();
  });
  $('#sTest').addEventListener('click', async ()=>{
    const ln = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications;
    if (!ln) { toast('Fitur notifikasi belum siap, coba lagi sebentar'); return; }
    try {
      let perm = await ln.checkPermissions();
      if (perm.display !== 'granted') perm = await ln.requestPermissions();
      if (perm.display !== 'granted') { toast('Izin notifikasi belum diberikan'); return; }
      await ln.schedule({ notifications: [{
        id: 999999,
        title: 'Notifikasi berhasil',
        body: 'Pengingat tugasmu akan tampil seperti ini.',
        schedule: { at: new Date(Date.now() + 2000) },
        channelId: 'tugasku-reminders'
      }]});
      toast('Notifikasi percobaan akan muncul dalam 2 detik');
    } catch(e){ toast('Gagal mengirim notifikasi percobaan'); }
  });

  // ---------- Notifikasi pengingat (native Android, tetap jalan walau app ditutup) ----------
  const LN = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications;

  async function askNotif(){
    if (!LN) return;
    try {
      const p = await LN.checkPermissions();
      if (p.display !== 'granted') await LN.requestPermissions();
    } catch(e){}
  }

  // id notifikasi Android harus berupa integer; buat id stabil dari id tugas + urutan pengingat
  function notifId(taskId, idx){
    let h = 0;
    for (let i=0;i<taskId.length;i++) h = (h*31 + taskId.charCodeAt(i)) >>> 0;
    return (h % 1000000) * 100 + idx; // ruang aman s/d 99 pengingat per tugas
  }

  // Menjadwalkan ULANG SEMUA notifikasi tiap kali tugas/pengaturan berubah.
  // Karena semua dijadwalkan via sistem Android (AlarmManager), tidak perlu app tetap terbuka.
  async function scheduleNotifs(){
    if (!LN) return;
    try {
      // bersihkan semua jadwal lama lalu buat ulang dari data saat ini (sumber kebenaran = tasks + cfg)
      const pending = await LN.getPending();
      if (pending.notifications.length){
        await LN.cancel({ notifications: pending.notifications.map(n=>({id:n.id})) });
      }
      if (!cfg.on) return;
      const perm = await LN.checkPermissions();
      if (perm.display !== 'granted') return;

      const now = Date.now();
      const first = cfg.start * UNIT_MS[cfg.startU], gap = cfg.gap * UNIT_MS[cfg.gapU];
      const toSchedule = [];

      tasks.filter(t=>!t.done).forEach(t=>{
        for (let i=0; i<cfg.count; i++){
          const leftAt = first - i*gap;         // sisa waktu target saat notifikasi ke-i muncul
          if (leftAt <= 0) break;               // sudah lewat tenggat, hentikan
          const fireAt = t.due - leftAt;        // waktu absolut notifikasi ini harus muncul
          if (fireAt <= now) continue;          // sudah lewat, jangan jadwalkan
          toSchedule.push({
            id: notifId(t.id, i),
            title: i === 0 ? 'Tenggat tugas mendekat' : `Pengingat ke-${i+1}`,
            body: `${t.t} (${t.mk||'Umum'}) dikumpulkan ${fmtLeft(leftAt)} lagi.`,
            schedule: { at: new Date(fireAt) },
            channelId: 'tugasku-reminders'
          });
        }
      });

      if (toSchedule.length) await LN.schedule({ notifications: toSchedule });
    } catch(e){ /* diam-diam gagal, tidak boleh mengganggu penggunaan app */ }
  }

  document.addEventListener('deviceready', async () => {
    if (LN) {
      try {
        await LN.createChannel({
          id: 'tugasku-reminders',
          name: 'Pengingat Tugas',
          description: 'Notifikasi pengingat tenggat tugas',
          importance: 5,
          visibility: 1
        });
      } catch(e){}
    }
    await askNotif();
    await scheduleNotifs();
  });
  document.addEventListener('click', askNotif, {once:true});

  render();
  // fallback bila deviceready sudah lewat sebelum listener terpasang (mis. reload cepat)
  if (window.Capacitor) scheduleNotifs();
})();
</script>
</body>
</html>
